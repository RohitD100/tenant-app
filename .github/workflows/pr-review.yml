name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Run AI PR Reviewer
        uses: RohitD100/CodeWatch@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}