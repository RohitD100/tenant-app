services:

  mongodb:
    image: mongo:8
    container_name: tenant-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: tenant-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: tenant-backend
    depends_on:
      - mongodb
      - redis
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379

  frontend:
    build:
      context: ./frontend
    container_name: tenant-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data: