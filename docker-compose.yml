services:

  mongodb:
    image: mongo:8
    container_name: tenant-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend

    container_name: tenant-backend

    depends_on:
      - mongodb

    ports:
      - "5000:5000"

    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build:
      context: ./frontend

    container_name: tenant-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mongo-data: